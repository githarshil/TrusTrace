services:
  - type: web
    name: trustrace-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm install --include=dev && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LIVE_MARKET_ENABLED
        value: "true"
      - key: YOUTUBE_MONITOR_ENABLED
        value: "true"
      - key: LLM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUBSCRIPTION_ENCRYPTION_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
